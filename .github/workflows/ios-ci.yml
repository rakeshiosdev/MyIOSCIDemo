name: iOS CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  ios-ci:

    name: SwiftLint + Unit Tests
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run Fastlane CI
        run: bundle exec fastlane ci